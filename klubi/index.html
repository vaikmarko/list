<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>The List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #2563eb;
      --orange: #ea580c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      width: 100%;
    }

    .pane {
      height: 100%;
      width: 100%;
      border: 0;
      background: var(--bg);
    }

    .pane + .pane {
      border-left: 1px solid var(--line);
    }

    .mobile-chooser {
      display: none;
      padding: 40px 20px;
      max-width: 480px;
      margin: 0 auto;
    }

    .mobile-chooser h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }

    .mcard {
      display: block;
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .mcard .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tag.blue { background: #eff6ff; color: var(--blue); }
    .tag.orange { background: #fff7ed; color: var(--orange); }

    .mcard strong {
      display: block;
      font-size: 16.5px;
      margin-bottom: 4px;
    }

    .mcard span {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    @media (max-width: 920px) {
      .split { display: none; }
      .mobile-chooser { display: block; }
    }
  </style>
</head>
<body>

<main class="split">
  <iframe class="pane" src="/klubi/inimene/?embed=1" title="The List inimesele"></iframe>
  <iframe class="pane" src="/klubi/restoran/?embed=1" title="The List restoranile"></iframe>
</main>

<section class="mobile-chooser">
  <h1>The List</h1>

  <a href="/klubi/inimene/" class="mcard">
    <em class="tag blue" style="font-style:normal">Inimesele</em>
    <strong>Kümme protsenti igalt ostult eurodena tagasi</strong>
    <span>Üks ühtne Walleti kaart üle Rotermanni, Artiuse ja Talsinki ilma eraldi äpita.</span>
  </a>

  <a href="/klubi/restoran/" class="mcard">
    <em class="tag orange" style="font-style:normal">Restoranile</em>
    <strong>Täishind kassasse ja püsiklient tagasi</strong>
    <span>Kuidas CompuCash saalis töötab, kuidas käib kuu lõpu tasaarveldus ja milles kokku lepime.</span>
  </a>
</section>

</body>
</html>
